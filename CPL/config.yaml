# =============================================================================
# Запуск: python merge_columns.py  (или join_columns.py — одинаковые файлы)
# HgLvCust. и ZW_CH6_Name — только с enrich_from (3805 ZW CH6) в config ниже
# Скрипт: merge_columns.py + папка lib/ (версия 2026-06-04-oop-v1)
# =============================================================================

output_file: merge_columns.xlsx
# Шаблон в именах файлов в sources (3805 Base.xlsx → при выборе 3804 станет 3804 Base.xlsx)
sorg: "3805"
# Папки SOrg: 3801 … 3806 (при запуске — меню или: python merge_columns.py -s 3805)
# source_dir: "3805"
# sorg_dirs: ["3801", "3802", "3803", "3804", "3805", "3806"]
# Не перезаписывать sources из «Таблица 1.xlsx» (иначе пропадёт HgLvCust.)
use_spec: false

# Порядок: Base, затем добавленные колонки; новые — в конец (сейчас последняя: Check CH6 Customer & Key_CH6).
column_order:
  - "SOrg."
  - "Customer"
  - "Name"
  - "Search Term 2"
  - "Indus."
  - "Ind.Code 1"
  - "Tax Number 1"
  - "A7"
  - "A8"
  - "SDst"
  - "CGrp"
  - "PG"
  - "Grp4"
  - "OrBlk"
  - "OrBlk2"
  - "CH6_CGrp"
  - "CH6 Customer"
  - "Check CH6_CGrp_KA"
  - "ZW"
  - "ZW_SO"
  - "ZW_A7"
  - "HgLvCust."
  - "ZW_CH6_Name"
  - "Check CH6 Customer & ZW"
  - "6th level"
  - "TN_CH6_Name"
  - "Check CH6 Customer & TN"
  - "Check Key At w/Ed reverse"
  - "Key"
  - "Key_CH6"
  - "Key_CH6_Name"
  - "Check CH6 Customer & Key_CH6"

# Customer Key — компактный ключ для справочника; Key — читаемый (с « & »)
computed_columns:
  - name: "Customer Key"
    type: customer_key
    suffix: "380N"
    standard_parts: ["Grp4", "CGrp", "A7"]
    at_work_parts: ["Grp4", "CGrp", "A7", "A8"]
    at_work_education:
      grp4_column: "Grp4"
      grp4_values: ["AWM"]
  - name: "Key"
    type: key
    separator: ""
    skip_empty: true
    standard_parts: ["Grp4", "CGrp", "A7", "ZW_A7", "Indus."]
    at_work_parts: ["Grp4", "CGrp", "A7", "A8", "ZW_A7", "Indus."]
    at_work_education:
      grp4_column: "Grp4"
      grp4_values: ["AWM"]

# excel_read_engine: calamine
# excel_write_engine: xlsxwriter
verbose: true

checks:
  - name: "Check CH6_CGrp_KA"
    type: match_when_in_either
    columns: ["CGrp", "CH6_CGrp"]
    values: ["S", "F", "K", "Q"]
    ok: "true"
    fail: "false"

  # CH6 Customer (3805 CH6) = хотя бы одному HgLvCust. из ZW CH6 (несколько ZW на Customer)
  - name: "Check CH6 Customer & ZW"
    type: ch6_customer_vs_zw_ch6
    ch6_customer_column: "CH6 Customer"
    zw_ch6_column: "HgLvCust."
    apply_when:
      all_non_empty: ["CH6 Customer", "HgLvCust.", "ZW"]
    ok: "true"
    fail: "false"

  # CH6 Customer = хотя бы одному коду TN_CH6 (6th level), только если есть Trade Name
  - name: "Check CH6 Customer & TN"
    type: ch6_customer_vs_zw_ch6
    ch6_customer_column: "CH6 Customer"
    zw_ch6_column: "6th level"
    apply_when:
      all_non_empty: ["CH6 Customer", "6th level", "Search Term 2"]
    ok: "true"
    fail: "false"

  # CH6 Customer (3805 CH6) = Key_CH6 (узел из справочника по Customer Key)
  - name: "Check CH6 Customer & Key_CH6"
    type: ch6_customer_vs_key_ch6
    ch6_customer_column: "CH6 Customer"
    compare_column: "Key_CH6"
    apply_when:
      all_non_empty: ["CH6 Customer", "Key_CH6"]
    ok: "true"
    fail: "false"

  # Не AWM, но CH6_CGrp=P и CGrp не P/Q → FAIL (обратная проверка из макета)
  - name: "Check Key At w/Ed reverse"
    type: key_at_work_reverse
    grp4_column: "Grp4"
    at_work_grp4_values: ["AWM"]
    reason_column: "CH6_CGrp"
    reason_values: ["P"]
    business_column: "CGrp"
    business_types: ["P", "Q"]
    ok: "true"
    fail: "false"

# Key_CH6 / Key_CH6_Name — после Customer Key, из справочника Ключ-Иерархия
post_sources:
  - file: "Справочник Ключ-Иерархия"
    sheet: 0
    merge_on:
      left: ["Customer Key"]
      right: ["Ключ"]
    dedupe: true
    columns:
      - name: "Key_CH6"
        source: "Иерархия"
      - name: "Key_CH6_Name"
        source: "Название узла"

sources:
  - file: "3805 Base.xlsx"
    sheet: 0
    columns:
      - "SOrg."
      - "Customer"
      - "Name"
      - "Search Term 2"
      - "Indus."
      - "Ind.Code 1"
      - "Tax Number 1"
      - "A7"
      - "A8"
      - "SDst"
      - "CGrp"
      - "PG"
      - "Grp4"
      - "OrBlk"
      - name: "OrBlk2"
        optional: true

  # Справочник CH6 — до перезаписи CGrp из ZW base (иначе CH6_CGrp пустая)
  - file: "Справочник_CH6_CGrp.xlsx"
    sheet: 0
    merge_on:
      left: ["CGrp"]
      right: ["CGrp"]
    dedupe: true
    columns:
      - name: "CGrp"
        source: "6th level"
      - name: "CH6_CGrp"
        source: "6th level_CGrp"

  # 6th level + TN_CH6_Name по SOrg.+Trade Name (Search Term 2); несколько CH6 на Trade Name — aggregate
  - file: "Справочник_CH6_CGrp.xlsx"
    sheet: 0
    merge_on:
      left: ["SOrg.", "Search Term 2"]
      right: ["SO Trade Name", "Trade Name"]
    aggregate:
      "6th level":
        source: "6th level"
        separator: ", "
        unique: true
      TN_CH6_Name:
        source: "6th level_name"
        separator: ", "
        unique: true
    merge_require_non_empty: ["Search Term 2"]
    columns:
      - name: "6th level"
        source: "6th level"
      - name: "TN_CH6_Name"
        source: "6th level_name"

  # HgLvCust. из 3805 CH6 для прямой иерархии IN-клиента (CH6 Customer)
  - file: "3805 CH6"
    sheet: 0
    merge_on:
      left: ["SOrg.", "Customer"]
      right: ["SOrg.", "Customer"]
    dedupe: true
    columns:
      - name: "CH6 Customer"
        source: "HgLvCust."

  # CGrp из 3805 ZW base по Customer
  - file: "3805 ZW base"
    sheet: 0
    merge_on:
      left: ["Customer"]
      right: ["Customer"]
    overwrite_columns: ["CGrp"]
    aggregate:
      CGrp:
        source: "CGrp"
        separator: ", "
        unique: true
    columns:
      - "CGrp"

  # 3805 ZW + HgLvCust. из CH6: ключ ZW_SO+ZW = SOrg.+Customer в файле CH6
  - file: "3805 ZW"
    sheet: 0
    merge_on:
      left: ["SOrg.", "Customer"]
      right: ["VKORG", "KUNNR"]
    enrich_from:
      - file: "3805 ZW CH6"
        merge_on:
          left: ["VKORG", "ZW"]
          right: ["SOrg.", "Customer"]
        dedupe: true
        columns:
          - name: "HgLvCust."
            source: "HgLvCust."
          - name: "ZW_CH6_Name"
            source: "Text:Customer number of the higher-level"
    aggregate:
      ZW:
        source: "KTONR"
        separator: ", "
        unique: true
      ZW_SO:
        source: "VKORG"
        separator: ", "
        unique: true
      HgLvCust.:
        separator: ", "
        unique: true
      ZW_CH6_Name:
        separator: ", "
        unique: true
    columns:
      - name: "ZW"
        source: "KTONR"

  # Запасной merge CH6 напрямую (если enrich_from не сработал — колонки всё равно появятся)
  - file: "3805 ZW CH6"
    sheet: 0
    merge_on:
      left: ["SOrg.", "Customer"]
      right: ["SOrg.", "Customer"]
    dedupe: true
    columns:
      - name: "HgLvCust."
        source: "HgLvCust."
      - name: "ZW_CH6_Name"
        source: "Text:Customer number of the higher-level"

  # A7 для ZW_A7 — из base (шапка как у 3805 Base), не из 3805 ZW
  - file: "3805 ZW base"
    sheet: 0
    merge_on:
      left: ["SOrg.", "Customer"]
      right: ["SOrg.", "Customer"]
    aggregate:
      ZW_A7:
        source: "A7"
        separator: ", "
        unique: true
    columns:
      - "A7"
