# =============================================================================
# merge_columns — правила сборки отчёта
# =============================================================================
#
# ПОРЯДОК СБОРКИ (lib/builder.py):
#   1. sources[]       — последовательный left join к Base (порядок блоков важен)
#   2. computed_columns — формулы Key, Customer Key (не из Excel)
#   3. post_sources[]  — join после Key (справочник Ключ-Иерархия)
#   4. checks[]        — колонки проверок true/false
#   5. cgrp_splits     — merge_{sorg}/:
#        Trade Name.xlsx — строки с заполненным Trade Name (не в bucket);
#        ADI/AIN/BDI/BIN, QDI+QIN — bucket-файлы;
#        основной файл — всё, что не попало в Trade Name / ADI / AIN / BDI / BIN / QDI QIN
#
# ПУТИ К ФАЙЛАМ (lib/paths.py, lib/sorg.py):
#   - Base, CH6, ZW…: папка {sorg} (3801–3806), имена «3805 …» → «{sorg} …»
#   - Справочники: reference_dir (по умолчанию references/) или корень проекта
#   - При --all: отдельный xlsx на каждую папку; sorg/source_dir подставляется в config
#
# ПАРАМЕТРЫ ИСТОЧНИКА (блок sources / post_sources):
#   merge_on.left/right — ключи join (Base ← файл)
#   dedupe: true        — одна строка справа на ключ (lookup)
#   dedupe: false       — fan-out: несколько строк справа → несколько строк в отчёте
#   columns             — что взять; source = колонка Excel; from = склейка в коде
#   optional: true      — нет колонки в Excel → пустая
#   fallback            — если нет колонки, взять из другой
#   overwrite_columns   — при совпадении имён перезаписать колонку Base
#   reference_filter    — отфильтровать справочник ({sorg} → код SOrg)
#   aggregate           — склеить несколько строк справа в одну (через запятую)
#   merge_require_non_empty — очистить добавленные колонки, если ключ пустой
#   enrich_from         — (редко) предварительный join внутри part перед основным
#   read_dedupe         — удалить дубли строк в выгрузке до merge (ключи Excel)
#
# ЛОГИКА В КОДЕ, НЕ ОПИСАННАЯ В БЛОКАХ НИЖЕ (lib/sources.py, lib/merger.py):
#   • ZW / ZW base / ZW CH6 читаются из папки текущего {sorg} (как Base).
#     Внутри файла в колонке SOrg. могут быть разные коды (3801…3806) — строки
#     НЕ отфильтровываются по SOrg.; берётся весь файл целиком.
#   • Join ZW к Base — по Customer/KUNNR или ZW/ZwPartner, без условия Base.SOrg.
#   • После всех merge: _finalize_zw_rows() (lib/merger.py):
#       - если ZW_SO есть, а ZW пуст → ZW := ZwPartner;
#       - broadcast: ZW, ZW_SO, ZW_A7, ZW_CGrp, ZW_CH6, ZW_CH6_Name
#         копируются на все строки того же Customer (без привязки к SOrg.);
#       - удаляются «призраки»: строки с пустыми ZW и ZW_SO, если у Customer
#         уже есть другая строка с заполненным ZW или ZW_SO.
#   • Ключи справа с тем же именем, что в Base (Customer, SOrg.), не затирают Base
#     (временный alias __merge_key__…).
#   • Пустой ZW у Customer = нет записи в «{sorg} ZW.xlsx» (KUNNR); merge не виноват.
#
# МОДЕЛЬ ДАННЫХ ZW:
#   Base.Customer     = sold-to (KUNNR)
#   «{sorg} ZW»       KUNNR → KTONR в колонку ZW (партнёр ZW)
#   «{sorg} ZW base»  Customer = партнёр (KTONR); ZwPartner; ZW_SO = SOrg. партнёра
#   «{sorg} ZW CH6»   Customer = партнёр; join по ZW + ZW_SO
# =============================================================================

output_file: merge_columns_{sorg}.xlsx
sorg: "3805"          # шаблон имён файлов в sources; реальная папка — source_dir / -s
reference_dir: "references"

# merge_{sorg}/Trade Name.xlsx — Trade Name заполнен, не в bucket ADI/AIN/BDI/BIN/QDI/QIN
# merge_{sorg}/merge_columns_{sorg}.xlsx — остаток (все строки, не попавшие в файлы выше)
# + merge_{sorg}/ADI.xlsx, AIN.xlsx, BDI.xlsx, BIN.xlsx, QDI QIN.xlsx
cgrp_splits:
  dir: "merge_{sorg}"
  bucket_column: "Check bucket"
  trade_name_column: "Trade Name"
  trade_name_file: "Trade Name.xlsx"
  require_trade_name_for_splits: true
  files:
    - bucket: "ADI"
    - bucket: "AIN"
    - bucket: "BDI"
    - bucket: "BIN"
  groups:
    - name: "QDI QIN.xlsx"
      buckets: ["QDI", "QIN"]

at_work_a8_reference:  # справочник для формулы Key (At Work / Education); лист в xlsx
  file: "Справочник At Work&Education.xlsx"
  sheet: "At Work"
  output_sheet: "Справочник At Work&Education"
  column: "A8"
  values:
    - "216"
    - "030"
    - "044"
    - "043"
    - "025"
    - "029"
    - "042"
    - "207"
column_order:  # порядок колонок в итоговом Excel (остальные — в конец)
  - "SOrg."
  - "Customer"
  - "Name"
  - "Trade Name"
  - "Indus."
  - "Ind.Code 1"
  - "Tax Number 1"
  - "A7"
  - "A8"
  - "SDst"
  - "CGrp"
  - "PG"
  - "Grp4"
  - "OrBlk"
  - "OrBlk2"
  - "CH6"
  - "CH6_Name"
  - "CH6_CGrp"
  - "Check CH6_CGrp_KA"
  - "ZW"
  - "ZW_SO"
  - "Check SO ZW_SO"
  - "ZW_A7"
  - "ZW_CGrp"
  - "ZW_CH6"
  - "ZW_CH6_Name"
  - "Check CH6 Customer & ZW"
  - "TN_CH6"
  - "TN_CH6_Name"
  - "TN_CGrp"
  - "Check CH6 Customer & TN"
  - "Check_TN_CGrp"
  - "Key"
  - "Key_CH6"
  - "Key_CH6_Name"
  - "Check CH6 Customer & Key_CH6"
  - "Key_CH6_SO"
  - "Check SO and Key CH6_SO"
  - "Check bucket"

# Вычисляются ПОСЛЕ sources[], ДО post_sources[] (lib/computed.py)
computed_columns:
  - name: "Customer Key"
    type: customer_key
    suffix: "380N"   # суффикс в справочнике Ключ-Иерархия (не код SOrg 3805)
    standard_parts: ["Grp4", "CGrp", "A7"]
    at_work_parts: ["Grp4", "CGrp", "A7", "A8"]
    at_work_education:
      reason_column: "CH6_CGrp"
      reason_values: ["P"]
      a8_column: "A8"
    business_type:
      column: "CGrp"
      values: ["P", "Q"]
  - name: "Key"
    type: key
    separator: ""
    formula: "Grp4 & CGrp & A7 & ZW_A7 & Indus."           # обычный Key
    at_work_formula: "Grp4 & CGrp & A7 & A8 & ZW_A7 & Indus."  # CGrp P/Q или CH6_CGrp P
    omit_parts_when:
      column: "Grp4"
      values: ["DI"]
      parts: ["ZW_A7"]
    # Grp4=DI и A8 из справочника At Work/Education → A7 & A8 & … (без ZW_A7)
    include_parts_when:
      - column: "Grp4"
        values: ["DI"]
        parts: ["A8"]
        insert_after: "A7"
        require_a8_in_reference: true
    invalid_key: ""
    at_work_education:
      reason_column: "CH6_CGrp"
      reason_values: ["P"]
      a8_column: "A8"
    business_type:
      column: "CGrp"
      values: ["P", "Q"]

text_columns:       # читать как текст (lib/sources.py)
  - "Tax Number 1"
  - "A7"
  - "ZW_A7"
  - "A8"
  - "PG"
  - "SDst"

leading_zero_columns:  # дополнить нулями слева при записи
  A7: 2
  ZW_A7: 2
  A8: 2
  PG: 2

column_colors:  # заливка заголовков в Excel (lib/builder.py)
  D7EACF:
    - "SOrg."
    - "Customer"
    - "Name"
    - "Trade Name"
    - "Indus."
    - "Ind.Code 1"
    - "Tax Number 1"
    - "A7"
    - "A8"
    - "SDst"
    - "CGrp"
    - "PG"
    - "Grp4"
    - "OrBlk"
    - "OrBlk2"
  E4DDF3:
    - "CH6"
    - "CH6_Name"
  F5E7B8:
    - "CH6_CGrp"
  F6D8C8:
    - "Check CH6_CGrp_KA"
    - "Check CH6 Customer & ZW"
    - "Check CH6 Customer & TN"
    - "Check_TN_CGrp"
    - "Check CH6 Customer & Key_CH6"
    - "Check SO ZW_SO"
    - "Check SO and Key CH6_SO"
    - "Check bucket"
  DCECF8:
    - "ZW"
    - "ZW_SO"
    - "Check SO ZW_SO"
    - "ZW_A7"
    - "ZW_CGrp"
    - "ZW_CH6"
    - "ZW_CH6_Name"
  D8E6E4:
    - "TN_CH6"
    - "TN_CH6_Name"
    - "TN_CGrp"
  D8E0F2:
    - "Key"
    - "Key_CH6"
    - "Key_CH6_Name"
    - "Key_CH6_SO"

excel_autofit_columns: true
excel_autofit_sample_rows: 1000
excel_autofit_max_width: 55

verbose: true

checks:
  - name: "Check CH6_CGrp_KA"
    type: match_when_in_either
    columns: ["CGrp", "CH6_CGrp"]
    values: ["S", "F", "K", "Q"]
    ok: "true"
    fail: "false"

  - name: "Check SO ZW_SO"
    type: compare_match_empty
    left_column: "SOrg."
    right_column: "ZW_SO"
    ok: "true"
    fail: "false"

  - name: "Check CH6 Customer & ZW"
    type: compare_match_empty
    left_column: "CH6"
    right_column: "ZW_CH6"
    ok: "true"
    fail: "false"
    apply_when:
      column_in:
        Grp4: ["IN"]

  - name: "Check CH6 Customer & TN"
    type: compare_match_empty
    left_column: "CH6"
    right_column: "TN_CH6"
    list_compare: true
    separator: ", "
    ok: "true"
    fail: "false"

  - name: "Check_TN_CGrp"
    type: match_when_in_either
    columns: ["CGrp", "TN_CGrp"]
    values: ["S", "F", "K", "Q"]
    ok: "true"
    fail: "false"

  - name: "Check CH6 Customer & Key_CH6"
    type: compare_match_empty
    left_column: "CH6"
    right_column: "Key_CH6"
    dash_match: true
    ok: "true"
    fail: "false"

  - name: "Check SO and Key CH6_SO"
    type: compare_match_empty
    left_column: "SOrg."
    right_column: "Key_CH6_SO"
    ok: "true"
    fail: "false"

# Join ПОСЛЕ computed_columns (нужны Key и Key_CH6)
post_sources:
  # Key_CH6: Key → Ключ в справочнике → узел Иерархия
  - file: "Справочник Ключ-Иерархия"
    sheet: 0
    merge_on:
      left: ["Key"]
      right: ["Ключ"]
    dedupe: true
    columns:
      - name: "Key_CH6"
        source: "Иерархия"

  # Key_CH6_Name: Key_CH6 → Иерархия → Название узла
  - file: "Справочник Ключ-Иерархия"
    sheet: 0
    merge_on:
      left: ["Key_CH6"]
      right: ["Иерархия"]
    dedupe: true
    columns:
      - name: "Key_CH6_Name"
        source: "Название узла"

  # Key_CH6_SO: Key_CH6 → 6th level в справочнике CH6 → SO
  - file: "Справочник_CH6 SO"
    sheet: 0
    merge_on:
      left: ["Key_CH6"]
      right: ["6th level"]
    dedupe: true
    columns:
      - name: "Key_CH6_SO"
        source: "SO"

# Основная цепочка merge; первый блок — база, без merge_on
sources:
  # --- 1. База: все строки отчёта из папки {sorg}; A7 только отсюда ---
  - file: "3805 Base.xlsx"
    sheet: 0
    read_dedupe: ["SOrg.", "Customer"]
    columns:
      - "SOrg."
      - "Customer"
      - "Name"
      - name: "Trade Name"
        source: "Search Term 2"
      - "Indus."
      - "Ind.Code 1"
      - "Tax Number 1"
      - "A7"
      - "A8"
      - "SDst"
      - "CGrp"
      - "PG"
      - "Grp4"
      - "OrBlk"
      - name: "OrBlk2"
        source: "OrBlk2"
        fallback: "OrBlk"   # нет OrBlk2 в файле → OrBlk

  # --- 2. CH6 sold-to: иерархия по SOrg.+Customer ---
  - file: "3805 CH6"
    sheet: 0
    read_dedupe: ["SOrg.", "Customer"]
    merge_on:
      left: ["SOrg.", "Customer"]
      right: ["SOrg.", "Customer"]
    dedupe: true
    columns:
      - name: "CH6"
        source: "HgLvCust."
      - name: "CH6_Name"
        source: "Text:Customer number of the higher-level"
        optional: true

  # --- 3. CGrp по узлу CH6 (справочник) ---
  - file: "Справочник_CH6_CGrp.xlsx"
    sheet: 0
    merge_on:
      left: ["CH6"]
      right: ["6th level"]
    dedupe: true
    columns:
      - name: "CH6_CGrp"
        source: "6th level_CGrp"

  # --- 4. Trade Name → TN_* (фильтр по SO Trade Name = {sorg}) ---
  - file: "Справочник_CH6_CGrp.xlsx"
    sheet: 0
    merge_on:
      left: ["Trade Name"]
      right: ["Trade Name"]
    reference_filter:
      SO Trade Name: "{sorg}"
    reference_filter_fallback: trade_name_only
    aggregate:
      TN_CH6:
        source: "6th level"
        separator: ", "
        unique: true
      TN_CH6_Name:
        source: "6th level_name"
        separator: ", "
        unique: true
      TN_CGrp:
        source: "6th level_CGrp"
        separator: ", "
        unique: true
    merge_require_non_empty: ["Trade Name"]
    columns:
      - name: "TN_CH6"
        source: "6th level"
      - name: "TN_CH6_Name"
        source: "6th level_name"
      - name: "TN_CGrp"
        source: "6th level_CGrp"

  # --- 5. ZW: sold-to → партнёр; файл из папки {sorg}; все строки файла (любой SOrg.) ---
  - file: "3805 ZW"
    sheet: 0
    read_dedupe: ["KUNNR", "KTONR"]
    merge_on:
      left: ["Customer"]   # Base sold-to
      right: ["KUNNR"]    # sold-to в файле ZW
    dedupe: false         # fan-out: у одного KUNNR может быть несколько KTONR
    columns:
      - name: "ZW"
        source: "KTONR"    # партнёр ZW

  # --- 6. ZW base: атрибуты партнёра; join ZW=ZwPartner; fan-out по SOrg. → ZW_SO ---
  - file: "3805 ZW base"
    sheet: 0
    read_dedupe: ["Customer", "SOrg."]
    merge_on:
      left: ["ZW"]         # уже заполнен из шага 5
      right: ["ZwPartner"] # Customer в ZW base = партнёр (KTONR)
    dedupe: false         # несколько SOrg. на партнёра → отдельная строка на каждый
    overwrite_columns: ["CGrp"]  # CGrp партнёра может перезаписать Base CGrp
    columns:
      - "CGrp"
      - name: "ZW_SO"
        source: "SOrg."    # SOrg. партнёра ZW (не Base.SOrg.)
      - name: "ZW_A7"
        source: "A7"
      - name: "ZW_CGrp"
        from: ["CGrp"]      # копия CGrp партнёра (inline computed)
      - name: "ZwPartner"
        source: "Customer" # партнёр из файла; служебная, удаляется в _finalize_zw_rows

  # --- 7. ZW CH6: иерархия партнёра; ключ ZW + ZW_SO ---
  - file: "3805 ZW CH6"
    sheet: 0
    read_dedupe: ["Customer", "SOrg."]
    merge_on:
      left: ["ZW", "ZW_SO"]
      right: ["ZwPartner", "SOrg."]  # SOrg. из ZW CH6 = ZW_SO после шага 6
    dedupe: false
    columns:
      - name: "ZwPartner"
        source: "Customer"   # партнёр в файле ZW CH6
      - name: "ZW_CH6"
        source: "HgLvCust."
      - name: "ZW_CH6_Name"
        source: "Text:Customer number of the higher-level"
