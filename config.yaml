excel_autofit_columns: true
excel_autofit_sample_rows: 1000
excel_autofit_max_width: 55

verbose: true

checks:
  - name: "Check CH6_CGrp"
    type: match_when_in_either
    columns: ["CGrp", "CH6_CGrp"]
    values: ["S", "F", "K", "Q"]
    ka_guardrail: true
    empty: ""
    ok: "Ok"
    fail: "False"

  - name: "Check SO ZW_SO"
    type: compare_match_empty
    left_column: "SOrg."
    right_column: "ZW_SO"
    ok: "true"
    fail: "false"

  - name: "Check CH6 Customer & ZW"
    type: compare_match_empty
    left_column: "CH6"
    right_column: "ZW_CH6"
    ok: "true"
    fail: "false"
    apply_when:
      column_in:
        Grp4: ["IN"]

  - name: "Check Key_IN_SO"
    type: compare_match_empty
    left_column: "Key_IN_SO"
    right_column: "ZW_Key_IN_SO"
    ok: "true"
    fail: "false"
    empty: ""
    skip: ""
    apply_when:
      column_not_equal:
        SOrg.: "ZW_SO"

  - name: "Check CH6 Customer & TN"
    type: compare_match_empty
    left_column: "CH6"
    right_column: "TN_CH6"
    list_compare: true
    separator: ", "
    empty: ""
    ok: "true"
    fail: "false"

  - name: "Check_TN_CGrp"
    type: match_when_in_either
    columns: ["CGrp", "TN_CGrp"]
    values: ["S", "F", "K", "Q"]
    empty: ""
    ok: "true"
    fail: "false"

  - name: "Check CH6 Customer & Key_CH6"
    type: compare_match_empty
    left_column: "CH6"
    right_column: "Key_CH6"
    dash_match: true
    empty: ""
    ok: "true"
    fail: "false"

  - name: "Check SO and Key CH6_SO"
    type: compare_match_empty
    left_column: "SOrg."
    right_column: "Key_CH6_SO"
    empty: ""
    ok: "true"
    fail: "false"

# Join ПОСЛЕ computed_columns (нужен Key отчёта)
post_sources:
  - file: "References_CH6.xlsx"
    sheet: "Key_CH6"
    merge_on:
      left: ["Key"]
      right: ["Key"]
    dedupe: true
    columns:
      - name: "Key_CH6"
        source: "Узел"
      - name: "Key_CH6_Name"
        source: "Название узла"
      - name: "Key_CH6_SO"
        source: "SO"

# Основная цепочка merge; первый блок — база, без merge_on
sources:
  # --- 1. База: все строки отчёта из папки {sorg}; A7 и CGrp только отсюда ---
  - file: "3805 Base.xlsx"
    sheet: 0
    read_dedupe: true
    columns:
      - "SOrg."
      - "Customer"
      - "Name"
      - name: "Trade Name"
        source: "Search Term 2"
      - "Indus."
      - "Tax Number 1"
      - "A7"
      - "A8"
      - "SDst"
      - "CGrp"
      - "PG"
      - "Grp4"
      - "OrBlk"
      - name: "OrBlk2"
        source: "OrBlk2"
        fallback: "OrBlk"   # нет OrBlk2 в файле → OrBlk

  # --- 2. CH6 sold-to: иерархия по SOrg.+Customer ---
  - file: "3805 CH6"
    sheet: 0
    read_dedupe: true
    merge_on:
      left: ["SOrg.", "Customer"]
      right: ["SOrg.", "Customer"]
    dedupe: true
    columns:
      - name: "CH6"
        source: "HgLvCust."
      - name: "CH6_Name"
        source: "Text:Customer number of the higher-level"
        optional: true

  # --- 3. CGrp по узлу CH6 (References_CH6 / Nodes_CH6) ---
  - file: "References_CH6.xlsx"
    sheet: "Nodes_CH6"
    merge_on:
      left: ["CH6"]
      right: ["6th level"]
    dedupe: true
    columns:
      - name: "CH6_CGrp"
        source: "6th level_CGrp"

  # --- 4. Trade Name → TN_* (Nodes_CH6: Trade Name → TRADE NAME) ---
  - file: "References_CH6.xlsx"
    sheet: "Nodes_CH6"
    merge_on:
      left: ["Trade Name"]
      right: ["Trade Name"]
    key_excel:
      Trade Name: "TRADE NAME"
    aggregate:
      TN_CH6:
        source: "6th level"
        separator: ", "
        unique: true
      TN_CH6_Name:
        source: "6th level_name"
        separator: ", "
        unique: true
      TN_CGrp:
        source: "6th level_CGrp"
        separator: ", "
        unique: true
    columns:
      - name: "6th level"
        source: "6th level"
      - name: "6th level_name"
        source: "6th level_name"
      - name: "6th level_CGrp"
        source: "6th level_CGrp"

  # --- 5. ZW: sold-to → партнёр; файл из папки {sorg}; все строки файла (любой SOrg.) ---
  - file: "3805 ZW"
    sheet: 0
    read_dedupe: true
    merge_on:
      left: ["Customer"]   # Base sold-to
      right: ["KUNNR"]    # sold-to в файле ZW
    dedupe: false         # fan-out: у одного KUNNR может быть несколько KTONR
    columns:
      - name: "ZW"
        source: "KTONR"    # партнёр ZW

  # --- 6. ZW base: атрибуты партнёра; join ZW=ZwPartner; fan-out по SOrg. → ZW_SO ---
  - file: "3805 ZW base"
    sheet: 0
    read_dedupe: true
    merge_on:
      left: ["ZW"]         # уже заполнен из шага 5
      right: ["ZwPartner"] # Customer в ZW base = партнёр (KTONR)
    dedupe: false         # несколько SOrg. на партнёра → отдельная строка на каждый
    columns:
      - name: "ZW_SO"
        source: "SOrg."    # SOrg. партнёра ZW (не Base.SOrg.)
      - name: "ZW_A7"
        source: "A7"
      - name: "ZW_CGrp"
        source: "CGrp"      # CGrp партнёра; Base.CGrp не трогаем
      - name: "ZwPartner"
        source: "Customer" # партнёр из файла; служебная, удаляется в _finalize_zw_rows

  # --- 7. ZW CH6: иерархия партнёра; ключ ZW + ZW_SO ---
  - file: "3805 ZW CH6"
    sheet: 0
    read_dedupe: true
    merge_on:
      left: ["ZW", "ZW_SO"]
      right: ["ZwPartner", "SOrg."]  # SOrg. из ZW CH6 = ZW_SO после шага 6
    dedupe: false
    columns:
      - name: "ZwPartner"
        source: "Customer"   # партнёр в файле ZW CH6
      - name: "ZW_CH6"
        source: "HgLvCust."
      - name: "ZW_CH6_Name"
        source: "Text:Customer number of the higher-level"

  # --- 8. Key_IN_SO по CH6 (Nodes_CH6: 6th level → KEY / Key_IN_SO), только cross-SO ---
  - file: "References_CH6.xlsx"
    sheet: "Nodes_CH6"
    merge_on:
      left: ["CH6"]
      right: ["6th level"]
    dedupe: true
    columns:
      - name: "Key_IN_SO"
        source: "Key_IN_SO"
        fallback: "KEY"

  # --- 9. ZW_Key_IN_SO по ZW_CH6 (Nodes_CH6) ---
  - file: "References_CH6.xlsx"
    sheet: "Nodes_CH6"
    merge_on:
      left: ["ZW_CH6"]
      right: ["6th level"]
    dedupe: true
    columns:
      - name: "ZW_Key_IN_SO"
        source: "Key_IN_SO"
        fallback: "KEY"
