output_file: merge_columns_{sorg}.xlsx
sorg: "3805"
reference_dir: "references"

at_work_a8_reference:
  file: "Справочник At Work&Education.xlsx"
  sheet: "At Work"
  output_sheet: "Справочник At Work&Education"
  column: "A8"
  values:
    - "216"
    - "030"
    - "044"
    - "043"
    - "025"
    - "029"
    - "042"
    - "207"
column_order:
  - "SOrg."
  - "Customer"
  - "Name"
  - "Trade Name"
  - "Indus."
  - "Ind.Code 1"
  - "Tax Number 1"
  - "A7"
  - "A8"
  - "SDst"
  - "CGrp"
  - "PG"
  - "Grp4"
  - "OrBlk"
  - "OrBlk2"
  - "CH6"
  - "CH6_Name"
  - "CH6_CGrp"
  - "Check CH6_CGrp_KA"
  - "ZW"
  - "ZW_SO"
  - "ZW_A7"
  - "ZW_CGrp"
  - "ZW_CH6"
  - "ZW_CH6_Name"
  - "Check CH6 Customer & ZW"
  - "TN_CH6"
  - "TN_CH6_Name"
  - "TN_CGrp"
  - "Check CH6 Customer & TN"
  - "Check_TN_CGrp"
  - "Key"
  - "Key_CH6"
  - "Key_CH6_Name"
  - "Check CH6 Customer & Key_CH6"

computed_columns:
  - name: "Customer Key"
    type: customer_key
    suffix: "380N"
    standard_parts: ["Grp4", "CGrp", "A7"]
    at_work_parts: ["Grp4", "CGrp", "A7", "A8"]
    at_work_education:
      reason_column: "CH6_CGrp"
      reason_values: ["P"]
      a8_column: "A8"
    business_type:
      column: "CGrp"
      values: ["P", "Q"]
  - name: "Key"
    type: key
    separator: ""
    formula: "Grp4 & CGrp & A7 & ZW_A7 & Indus."
    at_work_formula: "Grp4 & CGrp & A7 & A8 & ZW_A7 & Indus."
    omit_parts_when:
      column: "Grp4"
      values: ["DI"]
      parts: ["ZW_A7"]
    # Grp4=DI и A8 из справочника At Work/Education → A7 & A8 & … (без ZW_A7)
    include_parts_when:
      - column: "Grp4"
        values: ["DI"]
        parts: ["A8"]
        insert_after: "A7"
        require_a8_in_reference: true
    invalid_key: ""
    at_work_education:
      reason_column: "CH6_CGrp"
      reason_values: ["P"]
      a8_column: "A8"
    business_type:
      column: "CGrp"
      values: ["P", "Q"]

text_columns:
  - "Tax Number 1"
  - "A7"
  - "ZW_A7"
  - "A8"
  - "PG"
  - "SDst"

leading_zero_columns:
  A7: 2
  ZW_A7: 2
  A8: 2
  PG: 2

column_colors:
  D7EACF:
    - "SOrg."
    - "Customer"
    - "Name"
    - "Trade Name"
    - "Indus."
    - "Ind.Code 1"
    - "Tax Number 1"
    - "A7"
    - "A8"
    - "SDst"
    - "CGrp"
    - "PG"
    - "Grp4"
    - "OrBlk"
    - "OrBlk2"
  E4DDF3:
    - "CH6"
    - "CH6_Name"
  F5E7B8:
    - "CH6_CGrp"
  F6D8C8:
    - "Check CH6_CGrp_KA"
    - "Check CH6 Customer & ZW"
    - "Check CH6 Customer & TN"
    - "Check_TN_CGrp"
    - "Check CH6 Customer & Key_CH6"
  DCECF8:
    - "ZW"
    - "ZW_SO"
    - "ZW_A7"
    - "ZW_CGrp"
    - "ZW_CH6"
    - "ZW_CH6_Name"
  D8E6E4:
    - "TN_CH6"
    - "TN_CH6_Name"
    - "TN_CGrp"
  D8E0F2:
    - "Key"
    - "Key_CH6"
    - "Key_CH6_Name"

excel_autofit_columns: true
excel_autofit_sample_rows: 1000
excel_autofit_max_width: 55

verbose: true

checks:
  - name: "Check CH6_CGrp_KA"
    type: match_when_in_either
    columns: ["CGrp", "CH6_CGrp"]
    values: ["S", "F", "K", "Q"]
    ok: "true"
    fail: "false"

  - name: "Check CH6 Customer & ZW"
    type: ch6_customer_vs_zw_ch6
    ch6_customer_column: "CH6"
    zw_ch6_column: "ZW_CH6"
    apply_when:
      all_non_empty: ["CH6", "ZW_CH6", "ZW"]
      column_in:
        Grp4: ["IN"]
    ok: "true"
    fail: "false"

  - name: "Check CH6 Customer & TN"
    type: ch6_customer_vs_zw_ch6
    ch6_customer_column: "CH6"
    zw_ch6_column: "TN_CH6"
    apply_when:
      all_non_empty: ["CH6", "TN_CH6", "Trade Name"]
    ok: "true"
    fail: "false"

  - name: "Check_TN_CGrp"
    type: match_when_in_either
    columns: ["CGrp", "TN_CGrp"]
    values: ["S", "F", "K", "Q"]
    ok: "true"
    fail: "false"

  - name: "Check CH6 Customer & Key_CH6"
    type: ch6_customer_vs_key_ch6
    ch6_customer_column: "CH6"
    compare_column: "Key_CH6"
    apply_when:
      all_non_empty: ["CH6", "Key_CH6"]
    ok: "true"
    fail: "false"

post_sources:
  # Key_CH6: Customer Key → Ключ → колонка Иерархия (узел)
  - file: "Справочник Ключ-Иерархия"
    sheet: 0
    merge_on:
      left: ["Customer Key"]
      right: ["Ключ"]
    dedupe: true
    columns:
      - name: "Key_CH6"
        source: "Иерархия"

  # Key_CH6_Name: Key_CH6 → Иерархия (узел в справочнике) → Название узла
  - file: "Справочник Ключ-Иерархия"
    sheet: 0
    merge_on:
      left: ["Key_CH6"]
      right: ["Иерархия"]
    dedupe: true
    columns:
      - name: "Key_CH6_Name"
        source: "Название узла"

sources:
  - file: "3805 Base.xlsx"
    sheet: 0
    columns:
      - "SOrg."
      - "Customer"
      - "Name"
      - name: "Trade Name"
        source: "Search Term 2"
      - "Indus."
      - "Ind.Code 1"
      - "Tax Number 1"
      - "A7"
      - "A8"
      - "SDst"
      - "CGrp"
      - "PG"
      - "Grp4"
      - "OrBlk"
      - name: "OrBlk2"
        source: "OrBlk2"
        fallback: "OrBlk"

  - file: "3805 CH6"
    sheet: 0
    merge_on:
      left: ["SOrg.", "Customer"]
      right: ["SOrg.", "Customer"]
    dedupe: true
    columns:
      - name: "CH6"
        source: "HgLvCust."
      - name: "CH6_Name"
        source: "Text:Customer number of the higher-level"
        optional: true

  - file: "Справочник_CH6_CGrp.xlsx"
    sheet: 0
    merge_on:
      left: ["CH6"]
      right: ["6th level"]
    dedupe: true
    columns:
      - name: "CH6_CGrp"
        source: "6th level_CGrp"

  - file: "Справочник_CH6_CGrp.xlsx"
    sheet: 0
    merge_on:
      left: ["Trade Name"]
      right: ["Trade Name"]
    reference_filter:
      SO Trade Name: "{sorg}"
    reference_filter_fallback: trade_name_only
    aggregate:
      TN_CH6:
        source: "6th level"
        separator: ", "
        unique: true
      TN_CH6_Name:
        source: "6th level_name"
        separator: ", "
        unique: true
      TN_CGrp:
        source: "6th level_CGrp"
        separator: ", "
        unique: true
    merge_require_non_empty: ["Trade Name"]
    columns:
      - name: "TN_CH6"
        source: "6th level"
      - name: "TN_CH6_Name"
        source: "6th level_name"
      - name: "TN_CGrp"
        source: "6th level_CGrp"

  - file: "3805 ZW base"
    sheet: 0
    merge_on:
      left: ["Customer"]
      right: ["Customer"]
    dedupe: false
    overwrite_columns: ["CGrp"]
    columns:
      - "CGrp"
      - name: "ZW_SO"
        source: "SOrg."
      - name: "ZW_A7"
        source: "A7"
      - name: "ZW_CGrp"
        from: ["CGrp"]

  - file: "3805 ZW"
    sheet: 0
    merge_on:
      left: ["Customer"]
      right: ["KUNNR"]
    aggregate:
      ZW:
        source: "ZW"
        separator: ", "
        unique: true
    columns:
      - name: "ZW"
        source: "KTONR"

  - file: "3805 ZW CH6"
    sheet: 0
    merge_on:
      left: ["Customer"]
      right: ["Customer"]
    aggregate:
      ZW_CH6:
        source: "ZW_CH6"
        separator: ", "
        unique: true
      ZW_CH6_Name:
        source: "ZW_CH6_Name"
        separator: ", "
        unique: true
    columns:
      - name: "ZW_CH6"
        source: "HgLvCust."
      - name: "ZW_CH6_Name"
        source: "Text:Customer number of the higher-level"
